name: swayer

on:
  push:
    branches:
      - master
    tags:
      - '**'
    paths-ignore:
      - README.md
      - LICENSE
      - THIRD_PARTY_LICENSES.txt
      - .gitignore
      - .editorconfig
  pull_request:
    branches: [master]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency: singleton

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - name: Log in to GHCR
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/setup-buildx-action@v3
    - name: Docker test
      uses: docker/build-push-action@v7
      with:
        context: .
        target: test
        platforms: linux/amd64
        cache-from: type=gha,scope=swayer-master-test
        cache-to: type=gha,mode=max,scope=swayer-master-test
    - name: Build production candidate
      uses: docker/build-push-action@v7
      with:
        context: .
        target: final
        platforms: linux/amd64
        pull: true
        load: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:candidate
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
        cache-from: type=gha,scope=swayer-master-final
        cache-to: type=gha,mode=max,scope=swayer-master-final
    - name: Check production candidate
      run: docker run --rm --network none --entrypoint node "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:candidate" --version
    - name: Publish tested candidate
      if: github.event_name != 'pull_request'
      run: |
        image="$REGISTRY/$IMAGE_NAME"
        docker tag "$image:candidate" "$image:sha-$GITHUB_SHA"
        docker push "$image:sha-$GITHUB_SHA"
        docker tag "$image:candidate" "$image:$IMAGE_TAG"
        docker push "$image:$IMAGE_TAG"
